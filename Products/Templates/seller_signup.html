<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seller Signup | MegaStore</title>
  <style>
    body {
      font-family: Poppins, sans-serif;
      background: #f4f4f4;
      display: flex; justify-content: center; align-items: center;
      height: 100vh;
    }
    form {
      background: #fff; padding: 25px 30px; border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 350px;
    }
    h2 { text-align: center; color: #333; }
    input, textarea {
      width: 100%; padding: 10px; margin: 8px 0;
      border: 1px solid #ccc; border-radius: 6px;
    }
    button {
      width: 100%; background: #6c63ff; color: white;
      border: none; padding: 10px; border-radius: 6px;
      font-weight: bold; cursor: pointer;
    }
    button:hover { background: #5848d8; }
    p { text-align: center; margin-top: 10px; }
    a { color: #6c63ff; text-decoration: none; }
  </style>
</head>
<body>
  <form method="POST">
    {% csrf_token %}
    <h2>Seller Signup</h2>
    <input type="text" name="username" placeholder="Username" required>
    <input type="email" name="email" placeholder="Enter email" required>
    <input type="password" name="password" placeholder="Password" required>
    <input type="text" name="store_name" placeholder="Shop Name" required>
    <input type="text" name="phone" placeholder="Contact Number" required>
    <textarea name="address" placeholder="Shop Address" required></textarea>
    <button type="submit">Create Account</button>
    <p>Already have an account? <a href="{% url 'seller_login' %}">Login</a></p>
  </form>
</body>
</html>
